<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Hilo" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
    <title>Hilo</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* Si tras un despliegue el navegador tiene guardada una versión rota de la app
         (la página en lugar del programa), se limpia y se recarga una sola vez. */
      setTimeout(function () {
        var root = document.getElementById('root')
        if (root && root.childElementCount === 0 && !sessionStorage.getItem('hilo-rescate')) {
          sessionStorage.setItem('hilo-rescate', '1')
          var js = [].slice.call(document.querySelectorAll('script[type="module"][src]')).map(function (s) { return s.src })
          Promise.all([window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k) })) }) : null]
            .concat(js.map(function (u) { return fetch(u, { cache: 'reload' }).catch(function () {}) })))
            .then(function () { location.reload() })
        }
      }, 8000)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
